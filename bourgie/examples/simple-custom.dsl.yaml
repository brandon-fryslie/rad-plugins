# Simple Custom Theme - YAML DSL Example
# Demonstrates basic inline functions with CoffeeScript-style syntax

version: 3
final_space: true

blocks:
  - type: prompt
    alignment: left
    segments:
      # Custom directory display with icons
      - type: path
        style: plain
        foreground: '#00CED1'
        background: transparent
        custom_path: ->
          icon = "📁"
          icon = "🏠" if @PATH == @HOME
          icon = "⚙️" if @PATH.includes(".config")
          icon = "💻" if @PATH.includes("dev") || @PATH.includes("code")
          return "#{icon} #{@PATH} "

      # Smart git status with emoji indicators  
      - type: git
        style: plain
        foreground: '#90EE90'
        background: transparent
        properties:
          fetch_status: true
          fetch_stash_count: true
        smart_git: ->
          return "" unless @IS_WORK_TREE
          
          status = "🌿 #{@HEAD}"
          
          if @WORKING_CHANGED || @STAGING_CHANGED
            status += " 📝" if @WORKING_CHANGED
            status += " 📦" if @STAGING_CHANGED
          else
            status += " ✨"
          end
          
          status += " 📚#{@STASH_COUNT}" if @STASH_COUNT > 0
          
          return "#{status} "

      # Conditional environment indicators
      - type: text
        style: plain
        foreground: '#FFB6C1'
        background: transparent
        env_indicators: ->
          indicators = []
          indicators.push("🐳") if @ENABLE_DOCKER_PROMPT
          indicators.push("⬢") if @ENABLE_NODE_PROMPT
          indicators.push("🐍") if @VIRTUAL_ENV
          indicators.push("🔗") if @SSH_CLIENT
          
          return "" if indicators.empty?
          return "[#{indicators.join(" ")}] "

      # Dynamic prompt character based on context
      - type: text
        style: plain
        background: transparent
        dynamic_prompt: ->
          char = "❯"
          color = "#00CED1"
          
          if @IS_WORK_TREE
            char = "🚀"
            color = "#90EE90"
          end
          
          if @SSH_CLIENT
            char = "🌐"
            color = "#FFB6C1"  
          end
          
          if @ROOT
            char = "👑"
            color = "#FF6347"
          end
          
          return "#{char} "