# Simple Custom Theme - YAML DSL Example with new syntax
# Demonstrates basic inline functions with plain zsh code

version: 3
final_space: true

blocks:
  - type: prompt
    alignment: left
    segments:
      # Custom directory display with icons
      - type: path
        style: plain
        foreground: '#00CED1'
        background: transparent
        custom_fn: ->
          local icon="📁"
          [[ "$PWD" == "$HOME" ]] && icon="🏠"
          [[ "$PWD" == *".config"* ]] && icon="⚙️"
          [[ "$PWD" == *"dev"* || "$PWD" == *"code"* ]] && icon="💻"
          echo "${icon} ${PWD} "

      # Smart git status with emoji indicators  
      - type: git
        style: plain
        foreground: '#90EE90'
        background: transparent
        properties:
          fetch_status: true
          fetch_stash_count: true
        custom_fn: ->
          [[ -z "$POSH_GIT_STATUS" ]] && return
          
          local status="🌿 $POSH_GIT_HEAD"
          
          if [[ "$POSH_GIT_WORKING_CHANGED" == "true" || "$POSH_GIT_STAGING_CHANGED" == "true" ]]; then
            [[ "$POSH_GIT_WORKING_CHANGED" == "true" ]] && status+=" 📝"
            [[ "$POSH_GIT_STAGING_CHANGED" == "true" ]] && status+=" 📦"
          else
            status+=" ✨"
          fi
          
          [[ "$POSH_GIT_STASH_COUNT" -gt 0 ]] && status+=" 📚$POSH_GIT_STASH_COUNT"
          
          echo "${status} "

      # Conditional environment indicators
      - type: text
        style: plain
        foreground: '#FFB6C1'
        background: transparent
        custom_fn: ->
          local indicators=()
          [[ "$ENABLE_DOCKER_PROMPT" == "true" ]] && indicators+=("🐳")
          [[ "$ENABLE_NODE_PROMPT" == "true" ]] && indicators+=("⬢")
          [[ -n "$VIRTUAL_ENV" ]] && indicators+=("🐍")
          [[ -n "$SSH_CLIENT" ]] && indicators+=("🔗")
          
          [[ ${#indicators[@]} -eq 0 ]] && return
          
          local IFS=" "
          echo "[${indicators[*]}] "

      # Dynamic prompt character based on context
      - type: text
        style: plain
        background: transparent
        custom_fn: ->
          local char="❯"
          local color="#00CED1"
          
          if git rev-parse --git-dir >/dev/null 2>&1; then
            char="🚀"
            color="#90EE90"
          fi
          
          if [[ -n "$SSH_CLIENT" ]]; then
            char="🌐"
            color="#FFB6C1"
          fi
          
          if [[ "$EUID" -eq 0 ]]; then
            char="👑"
            color="#FF6347"
          fi
          
          echo "${char} "